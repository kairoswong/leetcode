<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solution Detail — LeetCode Explorer</title>
<link rel="icon" href="assets/leetcode.ico">
<script src="scripts/solutions-data.js"></script>
<style>
  /* ===== Self-hosted fonts ===== */
  @font-face {
    font-family: 'Instrument Sans';
    src: url('fonts/InstrumentSans.woff2') format('woff2');
    font-weight: 400 700;
    font-display: swap;
  }

  /* =====================================================
     Design System — same as index.html
     ===================================================== */
  :root {
    --surface-0: #0A0B0E;
    --surface-1: #121318;
    --surface-2: #1A1B22;
    --surface-3: #24262E;
    --surface-hover: #2C2E38;
    --text-primary: #EAEBED;
    --text-secondary: #9B9DA6;
    --text-tertiary: #6B6D78;
    --accent: #00D4AA;
    --accent-dim: #00A888;
    --accent-glow: rgba(0, 212, 170, 0.15);
    --green: #22C55E;
    --green-bg: rgba(34, 197, 94, 0.1);
    --yellow: #EAB308;
    --yellow-bg: rgba(234, 179, 8, 0.1);
    --red: #EF4444;
    --red-bg: rgba(239, 68, 68, 0.1);
    --amber: #F59E0B;
    --amber-bg: rgba(245, 158, 11, 0.1);
    --border: #2C2E38;
    --radius-sm: 4px;
    --radius-md: 8px;
    --radius-lg: 12px;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
    --font-ui: 'Instrument Sans', system-ui, sans-serif;
    --font-code: 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font-ui);
    background: var(--surface-0);
    color: var(--text-primary);
    line-height: 1.6;
    min-height: 100vh;
  }

  .app-container {
    max-width: 1040px;
    margin: 0 auto;
    padding: 0 32px;
  }

  /* =====================================================
     Nav bar
     ===================================================== */
  .top-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: 36px;
  }

  .top-nav .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    transition: color 0.15s;
    cursor: pointer;
    background: none;
    border: none;
    font-family: var(--font-ui);
  }

  .top-nav .back-link:hover {
    color: var(--accent);
  }

  .top-nav .nav-title {
    font-size: 13px;
    color: var(--text-tertiary);
  }

  .top-nav .nav-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  /* =====================================================
     GitHub link
     ===================================================== */
  .github-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    transition: color 0.15s, transform 0.15s;
  }

  .github-link:hover {
    color: var(--accent);
    transform: translateY(-1px);
  }

  .github-link svg {
    width: 20px;
    height: 20px;
    fill: currentColor;
    transition: fill 0.15s;
  }

  /* =====================================================
     Problem navigation — prev / next between solutions
     ===================================================== */
  .problem-navigation {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }

  .problem-navigation.bottom-nav {
    margin-top: 28px;
    margin-bottom: 48px;
  }

  .problem-navigation .nav-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    background: var(--surface-2);
    color: var(--text-secondary);
    font-family: var(--font-ui);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    text-decoration: none;
    white-space: nowrap;
    flex: 1 1 0;
    min-width: 0;
  }

  .problem-navigation .nav-btn:first-child {
    justify-content: flex-end;
  }

  .problem-navigation .nav-btn:last-child {
    justify-content: flex-start;
  }

  .problem-navigation .nav-btn:hover {
    background: var(--surface-hover);
    color: var(--text-primary);
    border-color: var(--accent-dim);
  }

  .problem-navigation .nav-btn.disabled {
    opacity: 0.3;
    pointer-events: none;
    cursor: default;
  }

  .problem-navigation .nav-btn .nav-label {
    color: var(--text-tertiary);
    font-size: 11px;
  }

  .problem-navigation .nav-btn .nav-title-text {
    max-width: 140px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .problem-navigation .nav-spacer {
    flex: 1;
  }

  .problem-navigation .nav-position {
    font-size: 12px;
    color: var(--text-tertiary);
    font-family: var(--font-code);
    padding: 0 4px;
  }

  /* =====================================================
     Problem header
     ===================================================== */
  .problem-header {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }

  .problem-id {
    font-family: var(--font-code);
    font-size: 14px;
    color: var(--text-tertiary);
    font-weight: 500;
  }

  .problem-title {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .problem-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 36px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    padding: 3px 10px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .badge.easy  { background: var(--green-bg); color: var(--green); }
  .badge.medium { background: var(--yellow-bg); color: var(--yellow); }
  .badge.hard  { background: var(--red-bg); color: var(--red); }
  .badge.solved { background: var(--green-bg); color: var(--green); }
  .badge.wip   { background: var(--amber-bg); color: var(--amber); border: 1px solid rgba(245, 158, 11, 0.3); }

  .tag-pill {
    display: inline-flex;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 500;
    background: var(--surface-2);
    color: var(--text-secondary);
    border: 1px solid var(--border);
  }

  .complexity-badges {
    display: flex;
    gap: 12px;
    margin-bottom: 32px;
  }

  .complexity-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border-radius: var(--radius-md);
    background: var(--surface-2);
    border: 1px solid var(--border);
    font-size: 13px;
  }

  .complexity-badge .label {
    color: var(--text-tertiary);
    font-weight: 500;
  }

  .complexity-badge .value {
    font-family: var(--font-code);
    color: var(--accent);
    font-weight: 500;
  }

  /* =====================================================
     Section layout — vertical stack
     ===================================================== */
  .detail-stack {
    display: flex;
    flex-direction: column;
    gap: 28px;
    margin-bottom: 56px;
  }

  .detail-stack .section-card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 28px;
  }

  .section-title {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-tertiary);
    margin-bottom: 20px;
  }

  /* =====================================================
     Code block
     ===================================================== */
  .code-block {
    background: var(--surface-0);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    overflow: hidden;
    min-height: 260px;
  }

  .code-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 16px;
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
  }

  .code-header .lang-label {
    font-size: 12px;
    color: var(--text-tertiary);
    font-weight: 500;
  }

  .copy-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-tertiary);
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
    font-family: var(--font-ui);
    transition: all 0.15s;
  }

  .copy-btn:hover {
    color: var(--accent);
    border-color: var(--accent-dim);
  }

  .copy-btn.copied {
    color: var(--green);
    border-color: var(--green);
  }

  pre {
    padding: 16px;
    overflow-x: auto;
    overflow-y: auto;
    max-height: 480px;
    font-family: var(--font-code);
    font-variant-ligatures: none;
    font-feature-settings: "liga" 0, "calt" 0;
    font-size: 14px;
    line-height: 1.7;
    color: var(--text-primary);
  }

  pre .keyword { color: #FF7B72; }
  pre .func    { color: #D2A8FF; }
  pre .string  { color: #A5D6FF; }
  pre .number  { color: #79C0FF; }
  pre .comment { color: #6B6D78; font-style: italic; }
  pre .class   { color: #FFA657; }
  pre .param   { color: #FFA657; }
  pre .self    { color: #FF7B72; }
  pre .builtin { color: #D2A8FF; }

  /* =====================================================
     Approach description
     ===================================================== */
  .approach-text {
    font-size: 15px;
    color: var(--text-secondary);
    line-height: 1.8;
    max-width: 720px;
  }

  .approach-text .key-insight {
    display: block;
    margin-top: 16px;
    padding: 12px 16px;
    background: var(--accent-glow);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius-sm);
    color: var(--accent);
    font-weight: 500;
  }

  /* =====================================================
     Related problems
     ===================================================== */
  .related-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .related-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    border-radius: var(--radius-md);
    background: var(--surface-2);
    cursor: pointer;
    transition: background 0.15s;
    text-decoration: none;
    color: inherit;
  }

  .related-item:hover {
    background: var(--surface-hover);
  }

  .related-item .related-id {
    font-family: var(--font-code);
    font-size: 12px;
    color: var(--text-tertiary);
  }

  .related-item .related-title {
    font-size: 14px;
    font-weight: 500;
  }

  /* =====================================================
     Animations
     ===================================================== */
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .section-card {
    animation: fadeIn 0.2s ease both;
  }
  .section-card:nth-child(1) { animation-delay: 0.04s; }
  .section-card:nth-child(2) { animation-delay: 0.06s; }
  .section-card:nth-child(3) { animation-delay: 0.10s; }

  /* =====================================================
     Responsive
     ===================================================== */
  @media (max-width: 768px) {
    .app-container { padding: 0 16px; }
    .problem-title { font-size: 22px; }

    .top-nav {
      flex-wrap: wrap;
      gap: 8px;
    }
    .top-nav .nav-title {
      order: 3;
      width: 100%;
      text-align: center;
    }

    .problem-header {
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
    }

    .problem-meta {
      gap: 6px;
    }

    .complexity-badges {
      flex-wrap: wrap;
      gap: 8px;
    }

    .problem-navigation {
      flex-wrap: wrap;
    }
    .problem-navigation .nav-btn {
      flex: 1 1 auto;
      min-width: 0;
    }
    .problem-navigation .nav-btn .nav-title-text {
      max-width: 80px;
    }
    .problem-navigation .nav-position {
      width: 100%;
      text-align: center;
      order: -1;
    }

    .detail-stack .section-card {
      padding: 20px 16px;
    }

    pre {
      font-size: 13px;
      max-height: 360px;
    }

    .related-item {
      flex-wrap: wrap;
      gap: 4px;
    }
  }

  @media (max-width: 480px) {
    .problem-navigation .nav-btn .nav-title-text {
      display: none;
    }
    .problem-navigation .nav-btn {
      justify-content: center;
    }
    .problem-navigation .nav-btn:first-child {
      justify-content: center;
    }
    .problem-navigation .nav-btn:last-child {
      justify-content: center;
    }
  }

  /* =====================================================
     Footer
     ===================================================== */
  .footer {
    border-top: 1px solid var(--border);
    padding: 24px 0;
    text-align: center;
    font-size: 13px;
    color: var(--text-tertiary);
  }

  .footer p {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 6px;
    line-height: 1;
  }

  .footer .github-link {
    display: inline-flex;
    align-items: center;
    line-height: 1;
  }
</style>
</head>
<body>

<div class="app-container">
  <!-- Top nav -->
  <nav class="top-nav">
    <button class="back-link" onclick="goBack()">← Back to Explorer</button>
    <span class="nav-title">Solution Detail</span>
    <a class="github-link" href="https://github.com/kairoswong/leetcode" target="_blank" rel="noopener" title="View on GitHub">

      </svg>
    </a>
  </nav>

  <!-- Problem navigation — prev / next -->
  <div class="problem-navigation">
    <button class="nav-btn" id="prevSolutionBtn" onclick="goToSolution('prev')">
      ← <span class="nav-label">Prev</span>
      <span class="nav-title-text" id="prevSolutionTitle"></span>
    </button>
    <span class="nav-position" id="navPosition"></span>
    <button class="nav-btn" id="nextSolutionBtn" onclick="goToSolution('next')">
      <span class="nav-label">Next</span>
      <span class="nav-title-text" id="nextSolutionTitle"></span> →
    </button>
  </div>

  <!-- Problem header -->
  <div class="problem-header">
    <span class="problem-id" id="probId">#000</span>
    <h1 class="problem-title" id="probTitle">Problem Title</h1>
  </div>
  <div class="problem-meta" id="probMeta">
    <span class="badge" id="probDifficulty">easy</span>
    <span class="badge" id="probStatus">solved</span>
    <span class="tag-pill" id="probTags">hash-map</span>
  </div>

  <!-- Complexity badges -->
  <div class="complexity-badges">
    <div class="complexity-badge">
      <span class="label">Time</span>
      <span class="value" id="timeComplexity">O(n)</span>
    </div>
    <div class="complexity-badge">
      <span class="label">Space</span>
      <span class="value" id="spaceComplexity">O(n)</span>
    </div>
  </div>

  <!-- Detail stack -- vertical: Code → Approach -->
  <div class="detail-stack">
    <!-- Solution Code -->
    <div class="section-card">
      <div class="section-title">Solution Code</div>
      <div class="code-block">
        <div class="code-header">
          <span class="lang-label">Python</span>
          <button class="copy-btn" id="copyBtn" onclick="copyCode()">Copy</button>
        </div>
        <pre id="codeContent"><span class="comment"># Loading…</span></pre>
      </div>
    </div>

    <!-- Approach -->
    <div class="section-card">
      <div class="section-title">Approach</div>
      <div class="approach-text" id="approachContent">
        <p id="approachDesc">Loading approach description…</p>
        <span class="key-insight" id="keyInsight">💡 Key insight here</span>
      </div>
    </div>

  </div>

  <!-- Bottom problem navigation — prev / next -->
  <div class="problem-navigation bottom-nav">
    <button class="nav-btn" id="prevSolutionBtnBottom" onclick="goToSolution('prev')">
      ← <span class="nav-label">Prev</span>
      <span class="nav-title-text" id="prevSolutionTitleBottom"></span>
    </button>
    <span class="nav-position" id="navPositionBottom"></span>
    <button class="nav-btn" id="nextSolutionBtnBottom" onclick="goToSolution('next')">
      <span class="nav-label">Next</span>
      <span class="nav-title-text" id="nextSolutionTitleBottom"></span> →
    </button>
  </div>

  <!-- Related problems -->
  <div class="section-card" style="margin-bottom:48px;">
    <div class="section-title">Related Problems</div>
    <div class="related-list" id="relatedList">
      <div style="color:var(--text-tertiary);font-size:14px;">More solutions loaded dynamically from the index.</div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <p>LeetCode Solutions Explorer &nbsp;·&nbsp;

        </svg>
        GitHub
      </a>
    </p>
  </div>
</div>

<script>
// =====================================================
// Load solution data
// =====================================================

let currentSolution = null;
const _detailData = {};  // populated from SOLUTIONS_DATA

// All solutions index — loaded from scripts/solutions-data.js (includes code)
let SOLUTIONS = [];

function loadSolutions() {
  if (typeof SOLUTIONS_DATA !== 'undefined') {
    SOLUTIONS = SOLUTIONS_DATA;
    // Build a code lookup map for quick access
    SOLUTIONS.forEach(s => { _detailData[s.id] = { code: s.code || '' }; });
    if (!window._pageInitialized) {
      initializePage();
    }
  } else {
    console.error('SOLUTIONS_DATA not found. Run: python scripts/generate-index.py');
    if (!window._pageInitialized) {
      document.getElementById('probTitle').textContent = 'Failed to load data';
    }
  }
}

function getSolutionById(id) {
  return SOLUTIONS.find(s => s.id === id);
}

// Get sorted IDs for prev/next navigation
function getSortedSolutionIds() {
  return SOLUTIONS.map(s => s.id).sort((a, b) => a - b);
}

// Navigate to the prev or next solution
function goToSolution(direction) {
  const ids = getSortedSolutionIds();
  const currentId = parseInt(new URLSearchParams(window.location.search).get('id'));
  const currentIndex = ids.indexOf(currentId);
  if (currentIndex === -1) return;

  let targetIndex;
  if (direction === 'prev') {
    targetIndex = currentIndex - 1;
  } else {
    targetIndex = currentIndex + 1;
  }

  if (targetIndex < 0 || targetIndex >= ids.length) return;
  window.location.href = `solution-detail.html?id=${ids[targetIndex]}`;
}

// Update prev/next button labels and disabled state
function updateProblemNavigation() {
  const ids = getSortedSolutionIds();
  const currentId = currentSolution ? currentSolution.id : parseInt(new URLSearchParams(window.location.search).get('id'));
  if (!currentId) return;
  const currentIndex = ids.indexOf(currentId);
  if (currentIndex === -1) return;

  // Update position indicator (both top and bottom)
  const posText = `${currentIndex + 1} / ${ids.length}`;
  document.getElementById('navPosition').textContent = posText;
  document.getElementById('navPositionBottom').textContent = posText;

  // Update prev buttons
  const updatePrev = (btnId, titleId) => {
    const btn = document.getElementById(btnId);
    const title = document.getElementById(titleId);
    if (currentIndex > 0) {
      const prevId = ids[currentIndex - 1];
      const prev = getSolutionById(prevId);
      if (prev) {
        title.textContent = `#${String(prev.id).padStart(3, '0')} ${prev.title}`;
      }
      btn.classList.remove('disabled');
    } else {
      title.textContent = '';
      btn.classList.add('disabled');
    }
  };

  // Update next buttons
  const updateNext = (btnId, titleId) => {
    const btn = document.getElementById(btnId);
    const title = document.getElementById(titleId);
    if (currentIndex < ids.length - 1) {
      const nextId = ids[currentIndex + 1];
      const next = getSolutionById(nextId);
      if (next) {
        title.textContent = `#${String(next.id).padStart(3, '0')} ${next.title}`;
      }
      btn.classList.remove('disabled');
    } else {
      title.textContent = '';
      btn.classList.add('disabled');
    }
  };

  updatePrev('prevSolutionBtn', 'prevSolutionTitle');
  updatePrev('prevSolutionBtnBottom', 'prevSolutionTitleBottom');
  updateNext('nextSolutionBtn', 'nextSolutionTitle');
  updateNext('nextSolutionBtnBottom', 'nextSolutionTitleBottom');
}

// Get the solution object from URL params or fallback to SOLUTIONS lookup
function getSolution() {
  const params = new URLSearchParams(window.location.search);
  const id = parseInt(params.get('id'));
  // Try data param first (passed from index.html)
  let data = params.get('data');
  if (data) {
    try {
      return JSON.parse(decodeURIComponent(data));
    } catch (_) {}
  }
  // Fallback: find by ID from loaded data
  if (SOLUTIONS.length > 0) {
    return getSolutionById(id);
  }
  return null;
}

// Initialize the page once data is loaded
async function initializePage() {
  window._pageInitialized = true;
  const solution = getSolution();
  currentSolution = solution;

  if (!solution) {
    document.getElementById('probTitle').textContent = 'Solution not found';
    document.getElementById('approachDesc').textContent = 'Could not find a solution with the given ID.';
    return;
  }

  document.getElementById('probId').textContent = `#${String(solution.id).padStart(3, '0')}`;
  document.getElementById('probTitle').textContent = solution.title;
  document.getElementById('probDifficulty').textContent = solution.difficulty;
  document.getElementById('probDifficulty').className = `badge ${solution.difficulty}`;
  document.getElementById('probStatus').textContent = solution.status === 'solved' ? 'Solved' : 'In Progress';
  document.getElementById('probStatus').className = `badge ${solution.status === 'solved' ? 'solved' : 'wip'}`;
  document.getElementById('probTags').textContent = solution.tags.join(', ');
  document.getElementById('timeComplexity').textContent = solution.complexity.time;
  document.getElementById('spaceComplexity').textContent = solution.complexity.space;
  document.getElementById('approachDesc').textContent = solution.approach || solution.desc;
  document.getElementById('keyInsight').innerHTML = `💡 ${solution.keyInsight || 'Key insight coming soon'}`;

  // Fetch and display actual solution code from the solutions/ directory
  loadSolutionCode(solution);

  // Related problems
  const relatedContainer = document.getElementById('relatedList');
  const related = SOLUTIONS.filter(s => {
    if (s.id === solution.id) return false;
    return s.tags.some(t => solution.tags.includes(t));
  }).slice(0, 4);

  if (related.length > 0) {
    relatedContainer.innerHTML = related.map(s => `
      <a class="related-item" href="solution-detail.html?id=${s.id}">
        <span>
          <span class="related-id">#${String(s.id).padStart(3, '0')}</span>
          <span class="related-title" style="margin-left:8px;">${s.title}</span>
        </span>
        <span class="badge ${s.difficulty}" style="font-size:10px;">${s.difficulty}</span>
      </a>
    `).join('');
  }

  // Update prev/next navigation
  updateProblemNavigation();
}

// =====================================================
// Fetch and syntax-highlight solution code from ../solutions/
// =====================================================

function highlightPython(code) {
  // Tokenize line by line
  return code.split('\n').map(line => {
    let trimmed = line.trimLeft();
    let indent = line.substring(0, line.length - trimmed.length);
    let result = indent;

    // Comment (full line)
    if (/^\s*#/.test(line)) {
      return `<span class="comment">${escapeHtml(line)}</span>`;
    }

    // Tokenize the trimmed part
    const tokens = [];
    let i = 0;
    while (i < trimmed.length) {
      // String literals
      if (trimmed[i] === "'" || trimmed[i] === '"') {
        const quote = trimmed[i];
        let j = i + 1;
        while (j < trimmed.length && trimmed[j] !== quote) {
          if (trimmed[j] === '\\') j++;
          j++;
        }
        if (j < trimmed.length) j++; // closing quote
        const str = trimmed.substring(i, j);
        // Check if this is a docstring (""" or ''')
        if (str.startsWith('"""') || str.startsWith("'''")) {
          tokens.push(`<span class="comment">${escapeHtml(str)}</span>`);
        } else {
          tokens.push(`<span class="string">${escapeHtml(str)}</span>`);
        }
        i = j;
        continue;
      }

      // Triple-quote docstrings (handled above for single-line, but multi-line is per-line)

      // Comments
      if (trimmed[i] === '#') {
        tokens.push(`<span class="comment">${escapeHtml(trimmed.substring(i))}</span>`);
        break;
      }

      // Numbers
      if (/\d/.test(trimmed[i]) && (i === 0 || /[\s\(\[,=+\-*/%]/.test(trimmed[i-1]))) {
        let j = i;
        while (j < trimmed.length && /[\d.]/.test(trimmed[j])) j++;
        tokens.push(`<span class="number">${escapeHtml(trimmed.substring(i, j))}</span>`);
        i = j;
        continue;
      }

      // Identifiers / keywords
      if (/[a-zA-Z_]/.test(trimmed[i])) {
        let j = i;
        while (j < trimmed.length && /[\w]/.test(trimmed[j])) j++;
        const word = trimmed.substring(i, j);
        if (['def', 'class', 'return', 'if', 'elif', 'else', 'for', 'while', 'in', 'not', 'and', 'or',
             'import', 'from', 'as', 'try', 'except', 'finally', 'with', 'raise', 'pass', 'break',
             'continue', 'lambda', 'yield', 'global', 'nonlocal', 'assert', 'del', 'is', 'None',
             'True', 'False'].includes(word)) {
          tokens.push(`<span class="keyword">${word}</span>`);
        } else if (word === 'self') {
          tokens.push(`<span class="self">self</span>`);
        } else {
          tokens.push(escapeHtml(word));
        }
        i = j;
        continue;
      }

      tokens.push(escapeHtml(trimmed[i]));
      i++;
    }

    return result + tokens.join('');
  }).join('\n');
}

function escapeHtml(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function loadSolutionCode(solution) {
  const detail = _detailData[solution.id];
  if (detail && detail.code) {
    document.getElementById('codeContent').innerHTML = highlightPython(detail.code);
  } else {
    document.getElementById('codeContent').innerHTML =
      `<span class="comment"># Code not available for this solution.</span>`;
  }
}

// =====================================================
// Navigation & Actions
// =====================================================

function goBack() {
  window.location.href = 'index.html';
}

function copyCode() {
  const code = document.getElementById('codeContent').textContent;
  navigator.clipboard.writeText(code).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
  });
}

// Kick off data loading
loadSolutions();
